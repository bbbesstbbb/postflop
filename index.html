<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Покерный тренажер — навигация</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #1e1e2f;
      color: #fff;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #151525;
      border-right: 1px solid #2a2a3e;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .sidebar h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      color: #ffd700;
      letter-spacing: 1px;
    }

    .nav-btn {
      background: #2a2a3e;
      border: none;
      border-radius: 8px;
      color: #ddd;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 16px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .nav-btn:hover {
      background: #3a3a5a;
      color: #fff;
    }

    .nav-btn.active {
      background: #e94560;
      color: #fff;
      transform: scale(1.02);
    }

    .content {
      flex: 1;
      height: 100vh;
      background: #1e1e2f;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #1e1e2f;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>🃏 Тренажер</h2>
    <button class="nav-btn" data-page="flop-editor.html">🎨 Редактор флопов</button>
    <button class="nav-btn" data-page="flop-actions.html">📊 Действия на флопе</button>
    <button class="nav-btn" data-page="turn-actions.html">📊 Действия на терне</button>
    <button class="nav-btn" data-page="river-actions.html">📊 Действия на ривере</button>
    <button class="nav-btn" data-page="conditions.html">⚙️ Условия и уроки</button>
    <button class="nav-btn" data-page="trainer.html">🎲 Тренажер</button>
  </div>
  <div class="content">
    <iframe id="appFrame" src="flop-editor.html"></iframe>
  </div>

  <script>
    const buttons = document.querySelectorAll('.nav-btn');
    const iframe = document.getElementById('appFrame');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        iframe.src = btn.dataset.page;
      });
    });

    // Подсветить первую кнопку
    buttons[0].classList.add('active');
  </script>
</body>
</html>
