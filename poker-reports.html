<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отчёты по тренировкам</title>
  <style>
    :root {
      --bg: #f1f2f6;
      --panel: #ffffff;
      --border: #dfe4ea;
      --text: #1e272e;
      --accent: #2d3436;
      --blue: #0984e3;
      --green: #00b894;
      --red: #d63031;
      --purple: #6c5ce7;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    header h1 { font-size: 20px; margin: 0; font-weight: 800; }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #ffffff;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { background: #3d4348; }
    .btn:active { transform: scale(0.97); }
    .btn-danger { background: var(--red); }
    .btn-danger:hover { background: #b02318; }
    .btn-back { background: var(--purple); }
    .btn-back:hover { background: #5b4bc4; }

    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 18px;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      flex: 1;
      min-width: 180px;
      text-align: center;
    }

    .summary-card .label { font-size: 13px; color: #57606f; font-weight: 600; }
    .summary-card .value { font-size: 28px; font-weight: 800; margin-top: 4px; }

    .lesson-list { display: flex; flex-direction: column; gap: 12px; }

    .lesson-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .lesson-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      background: #f8f9fa;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .lesson-header:hover { background: #eef1f4; }

    .lesson-name { font-size: 16px; font-weight: 700; }
    .lesson-stats { display: flex; gap: 20px; align-items: center; font-size: 14px; }

    .lesson-details { padding: 16px; }
    .lesson-details.hidden { display: none; }

    .detail-section { margin-bottom: 20px; }
    .detail-section h3 { font-size: 15px; font-weight: 700; margin: 0 0 10px; color: #2d3436; }

    .stats-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .stats-table th, .stats-table td { border: 1px solid #e1e5eb; padding: 6px 8px; text-align: center; }
    .stats-table th { background: #f8f9fa; font-weight: 700; }

    .clickable { cursor: pointer; color: var(--blue); text-decoration: underline; }

    .error-list { margin-top: 8px; padding-left: 20px; font-size: 13px; }
    .error-item {
      background: #fff3f3;
      border-left: 4px solid var(--red);
      padding: 4px 8px;
      margin-bottom: 4px;
      border-radius: 4px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #57606f;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .stage-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .stage-tab {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      user-select: none;
    }
    .stage-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    @media (max-width: 600px) {
      .main-container { padding: 10px; }
      .summary { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📊 Отчёты по тренировкам</h1>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button id="backBtn" class="btn btn-back" title="Вернуться в тренажёр">⬅️ В тренажёр</button>
      <button id="clearStatsBtn" class="btn btn-danger" title="Удалить всю историю тренировок">🗑 Очистить статистику</button>
    </div>
  </header>

  <div class="main-container">
    <div id="summary" class="summary"></div>
    <div id="lessonList" class="lesson-list"></div>
    <div id="emptyState" class="empty" style="display: none;">
      Нет данных для отображения. Сначала завершите тренировки в тренажёре.
    </div>
  </div>

  <script>
    // ==================== КОНСТАНТЫ ====================
    const LESSONS_STORAGE_KEY = 'pokerSessionLessons_v1';
    const HISTORY_STORAGE_KEY = 'pokerTrainerHistory_v1';
    const MATRIX_STORAGE_KEY = 'flopMatrixState_v1';

    const HAND_CATEGORIES = ['Мусор', 'Гатшот', 'Дро', 'Лоу', 'Мидл', 'Топ', 'Две пары+'];
    const TURN_TYPE_LABELS = { over: 'Оверкарта', under: 'Андеркарта', pair: 'Спарка' };
    const RIVER_TYPE_LABELS = { nopair: 'Не спарилась', paired: 'Спарилась' };

    // ==================== ЗАГРУЗКА ДАННЫХ ====================
    function loadLessons() {
      try {
        const raw = localStorage.getItem(LESSONS_STORAGE_KEY);
        return raw ? (Array.isArray(JSON.parse(raw)) ? JSON.parse(raw) : []) : [];
      } catch (e) { console.warn('Ошибка загрузки уроков:', e); return []; }
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
        return raw ? (Array.isArray(JSON.parse(raw)) ? JSON.parse(raw) : []) : [];
      } catch (e) { console.warn('Ошибка загрузки истории:', e); return []; }
    }

    function loadGroupNames() {
      window.groupNames = {};
      try {
        const raw = localStorage.getItem(MATRIX_STORAGE_KEY);
        if (raw) {
          const matrix = JSON.parse(raw);
          if (matrix && matrix.colors) {
            matrix.colors.forEach(c => { window.groupNames[String(c.id)] = c.name; });
          }
        }
      } catch (e) { console.warn('Ошибка загрузки названий групп:', e); }
    }

    // ==================== АГРЕГАЦИЯ ====================
    function aggregateHistory(history) {
      const byLesson = {};
      history.forEach(record => {
        if (!byLesson[record.lessonId]) {
          byLesson[record.lessonId] = {
            total: 0, correct: 0,
            totalTime: 0,
            byStage: { flop: {}, turn: {}, river: {} },
            errors: []
          };
        }
        const lessonStats = byLesson[record.lessonId];
        lessonStats.total++;
        if (record.isCorrect) lessonStats.correct++;
        else lessonStats.errors.push(record);

        // Время
        const elapsed = typeof record.elapsed === 'number' ? record.elapsed : 0;
        lessonStats.totalTime += elapsed;

        const stage = record.stage;
        const stageStats = lessonStats.byStage[stage] || (lessonStats.byStage[stage] = {});
        if (!stageStats[record.groupId]) {
          stageStats[record.groupId] = { total: 0, correct: 0, totalTime: 0, byCategory: {}, errors: [] };
        }
        const groupStats = stageStats[record.groupId];
        groupStats.total++;
        if (record.isCorrect) groupStats.correct++;
        else groupStats.errors.push(record);
        groupStats.totalTime += elapsed;

        const cat = record.category;
        if (!groupStats.byCategory[cat]) {
          groupStats.byCategory[cat] = { total: 0, correct: 0, totalTime: 0, errors: [] };
        }
        const catStats = groupStats.byCategory[cat];
        catStats.total++;
        if (record.isCorrect) catStats.correct++;
        else catStats.errors.push(record);
        catStats.totalTime += elapsed;
      });
      return byLesson;
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '—';
      if (seconds < 1) return seconds.toFixed(1) + ' с';
      return seconds.toFixed(1) + ' с';
    }

    function renderSummary(byLesson) {
      const totalAll = Object.values(byLesson).reduce((s, l) => s + l.total, 0);
      const correctAll = Object.values(byLesson).reduce((s, l) => s + l.correct, 0);
      const acc = totalAll > 0 ? Math.round((correctAll / totalAll) * 100) : 0;
      const totalTimeAll = Object.values(byLesson).reduce((s, l) => s + l.totalTime, 0);
      const avgTimeAll = totalAll > 0 ? (totalTimeAll / totalAll).toFixed(1) : '—';

      document.getElementById('summary').innerHTML = `
        <div class="summary-card"><div class="label">Всего ответов</div><div class="value">${totalAll}</div></div>
        <div class="summary-card"><div class="label">Правильных</div><div class="value">${correctAll}</div></div>
        <div class="summary-card"><div class="label">Точность</div><div class="value">${acc}%</div></div>
        <div class="summary-card"><div class="label">Среднее время</div><div class="value">${avgTimeAll} с</div></div>
      `;
    }

    function renderLessonList(byLesson, lessons) {
      const listContainer = document.getElementById('lessonList');
      listContainer.innerHTML = '';
      if (Object.keys(byLesson).length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      document.getElementById('emptyState').style.display = 'none';

      lessons.forEach(lesson => {
        const lessonStats = byLesson[lesson.id];
        if (!lessonStats) return;

        const accuracy = lessonStats.total > 0 ? Math.round((lessonStats.correct / lessonStats.total) * 100) : 0;
        const avgTime = lessonStats.total > 0 ? (lessonStats.totalTime / lessonStats.total).toFixed(1) : '—';

        const item = document.createElement('div');
        item.className = 'lesson-item';

        const header = document.createElement('div');
        header.className = 'lesson-header';
        header.innerHTML = `
          <span class="lesson-name">${lesson.name}</span>
          <span class="lesson-stats">
            <span>${lessonStats.correct}/${lessonStats.total}</span>
            <span>${accuracy}%</span>
            <span>⏱ ${avgTime} с</span>
          </span>
        `;

        const details = document.createElement('div');
        details.className = 'lesson-details hidden';

        // Статистика по стадиям
        const stageTabs = document.createElement('div');
        stageTabs.className = 'stage-tabs';
        ['flop', 'turn', 'river'].forEach(stage => {
          const tab = document.createElement('span');
          tab.className = 'stage-tab';
          tab.textContent = stage === 'flop' ? 'Флоп' : stage === 'turn' ? 'Терн' : 'Ривер';
          tab.dataset.stage = stage;
          tab.addEventListener('click', () => {
            stageTabs.querySelectorAll('.stage-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderStageDetails(stage, lessonStats.byStage[stage] || {}, details, lesson.id);
          });
          stageTabs.appendChild(tab);
        });

        details.appendChild(stageTabs);

        // По умолчанию показываем флоп
        const defaultStage = 'flop';
        details.querySelector('.stage-tab[data-stage="flop"]').classList.add('active');
        renderStageDetails(defaultStage, lessonStats.byStage[defaultStage] || {}, details, lesson.id);

        // Последние ошибки
        if (lessonStats.errors.length > 0) {
          const errorSection = document.createElement('div');
          errorSection.className = 'detail-section';
          errorSection.innerHTML = '<h3>Последние ошибки</h3>';
          const ul = document.createElement('ul');
          ul.className = 'error-list';
          lessonStats.errors.slice(-10).forEach(err => {
            const li = document.createElement('li');
            li.className = 'error-item';
            li.textContent = `${err.stage === 'flop' ? 'Флоп' : err.stage === 'turn' ? 'Терн' : 'Ривер'}: категория ${err.category}, ваше действие: ${err.action}, правильно: ${err.correctAction} (⏱ ${formatTime(err.elapsed)})`;
            ul.appendChild(li);
          });
          errorSection.appendChild(ul);
          details.appendChild(errorSection);
        }

        item.appendChild(header);
        item.appendChild(details);
        listContainer.appendChild(item);

        header.addEventListener('click', () => details.classList.toggle('hidden'));
      });
    }

    function renderStageDetails(stage, stageStats, container, lessonId) {
      const existing = container.querySelectorAll('.stage-content');
      existing.forEach(el => el.remove());

      const content = document.createElement('div');
      content.className = 'stage-content';

      if (Object.keys(stageStats).length === 0) {
        content.innerHTML = '<div class="hint">Нет данных по этой стадии.</div>';
        container.appendChild(content);
        return;
      }

      let html = '<div class="detail-section"><h3>Статистика по группам флопов</h3><table class="stats-table"><tr><th>Группа флопа</th><th>Всего</th><th>Правильных</th><th>Точность</th><th>Ср. время</th><th>Ошибки</th></tr>';
      Object.entries(stageStats).forEach(([groupId, groupStats]) => {
        const groupName = window.groupNames && window.groupNames[groupId] ? window.groupNames[groupId] : groupId;
        const groupAcc = groupStats.total > 0 ? Math.round((groupStats.correct / groupStats.total) * 100) : 0;
        const avgTime = groupStats.total > 0 ? (groupStats.totalTime / groupStats.total).toFixed(1) : '—';
        html += `<tr>
          <td>${groupName}</td>
          <td>${groupStats.total}</td>
          <td>${groupStats.correct}</td>
          <td>${groupAcc}%</td>
          <td>${avgTime} с</td>
          <td><span class="clickable" data-group="${groupId}">${groupStats.errors.length} шт.</span></td>
        </tr>`;
      });
      html += '</table></div>';
      content.innerHTML = html;

      content.querySelectorAll('.clickable[data-group]').forEach(el => {
        el.addEventListener('click', () => {
          const groupId = el.dataset.group;
          const groupStats = stageStats[groupId];
          showCategoryDetails(groupStats, content);
        });
      });

      container.appendChild(content);
    }

    function showCategoryDetails(groupStats, container) {
      if (!groupStats) return;
      const catDiv = document.createElement('div');
      catDiv.className = 'detail-section';
      let html = '<h3>Категории рук</h3><table class="stats-table"><tr><th>Категория</th><th>Всего</th><th>Правильных</th><th>Точность</th><th>Ср. время</th><th>Ошибки</th></tr>';
      Object.entries(groupStats.byCategory).forEach(([cat, catStats]) => {
        const acc = catStats.total > 0 ? Math.round((catStats.correct / catStats.total) * 100) : 0;
        const avgTime = catStats.total > 0 ? (catStats.totalTime / catStats.total).toFixed(1) : '—';
        html += `<tr>
          <td>${cat}</td>
          <td>${catStats.total}</td>
          <td>${catStats.correct}</td>
          <td>${acc}%</td>
          <td>${avgTime} с</td>
          <td><button class="btn" data-category="${cat}">Показать ошибки (${catStats.errors.length})</button></td>
        </tr>`;
      });
      html += '</table></div>';
      catDiv.innerHTML = html;

      catDiv.querySelectorAll('button[data-category]').forEach(btn => {
        btn.addEventListener('click', () => {
          const category = btn.dataset.category;
          const errors = groupStats.byCategory[category].errors;
          const sublist = document.createElement('div');
          sublist.className = 'error-sublist';
          let errorsHtml = '<ul class="error-list">';
          errors.slice(-20).forEach(err => {
            errorsHtml += `<li class="error-item">${new Date(err.timestamp).toLocaleString()}: вы выбрали ${err.action}, правильно ${err.correctAction} (⏱ ${formatTime(err.elapsed)})</li>`;
          });
          errorsHtml += '</ul>';
          sublist.innerHTML = errorsHtml;
          const prev = catDiv.querySelector('.error-sublist');
          if (prev) prev.remove();
          catDiv.appendChild(sublist);
        });
      });

      const prev = container.querySelector('.category-details');
      if (prev) prev.remove();
      catDiv.classList.add('category-details');
      container.appendChild(catDiv);
    }

    // ==================== ОЧИСТКА СТАТИСТИКИ ====================
    document.getElementById('clearStatsBtn').addEventListener('click', () => {
      const sure = confirm('Удалить всю историю тренировок? Это действие необратимо.');
      if (!sure) return;
      localStorage.removeItem(HISTORY_STORAGE_KEY);
      document.getElementById('summary').innerHTML = '';
      document.getElementById('lessonList').innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
    });

    // ==================== ВОЗВРАТ В ТРЕНАЖЁР ====================
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'poker-trainer.html';
    });

    // ==================== ИНИЦИАЛИЗАЦИЯ ====================
    function initApp() {
      loadGroupNames();
      const lessons = loadLessons();
      const history = loadHistory();
      if (history.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      const byLesson = aggregateHistory(history);
      renderSummary(byLesson);
      renderLessonList(byLesson, lessons);
    }

    initApp();
  </script>
</body>
</html>
